[project]
name = "child-diary-downloader"
version = "0.1.0"
description = "Backup não oficial do ChildDiary: arquiva fotos, vídeos e PDFs dos teus filhos e envia os resumos diários para o Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frederico Fernandes" }]
keywords = ["childdiary", "backup", "creche", "kindergarten", "telegram", "photos", "archive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "requests>=2.32",
  "click>=8.1",
  "rich>=13.0",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
  "python-dotenv>=1.0",
  "croniter>=6.2.4",
  "pydantic>=2.7",
]

[project.scripts]
childdiary = "childdiary_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/fredericofernandes/child-diary-downloader"
Issues = "https://github.com/fredericofernandes/child-diary-downloader/issues"
Changelog = "https://github.com/fredericofernandes/child-diary-downloader/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/childdiary_downloader"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
  "types-PyYAML",
  "pre-commit>=4.6.2",
  "types-croniter>=6.2.4.20260711",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Portuguese text with accents and dashes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal expectations are clearer unbroken

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["childdiary_downloader"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\.$"]
